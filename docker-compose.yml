# Ambiente local: PostgreSQL, app (Next.js) e worker, a partir de uma única imagem.
# Uso: cp .env.example .env && docker compose up -d --wait

x-env-app: &env-app
  # .env opcional: `docker compose build`/`config` funcionam sem ele (CA-7).
  env_file:
    - path: .env
      required: false
  environment:
    # Na rede do compose o host é "postgres" (o .env aponta para localhost, para uso fora do container).
    DATABASE_URL: postgresql://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD:-agenda_dev}@postgres:5432/${POSTGRES_DB:-agenda_beleza}
    # Obrigatório em produção (a imagem roda com NODE_ENV=production); este padrão serve só ao compose local.
    RATE_LIMIT_SEGREDO: ${RATE_LIMIT_SEGREDO:-compose-local-segredo-do-limite-0123456789}
    AVALIACAO_SEGREDO: ${AVALIACAO_SEGREDO:-compose-local-segredo-avaliacao-0123456789}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_beleza}
      # Lida pelo script de initdb para criar a base de testes de integração.
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Publicada para os testes locais (npm test). Se a 5432 estiver ocupada, troque POSTGRES_PORT.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 força TCP: durante o initdb o servidor temporário só escuta no socket Unix.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: agenda-beleza:dev
    command: ["app"]
    init: true
    <<: *env-app
    environment:
      # environment aqui SUBSTITUI o da âncora (merge raso): repetir o que a âncora define.
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD:-agenda_dev}@postgres:5432/${POSTGRES_DB:-agenda_beleza}
      ARMAZENAMENTO_DIR: /app/.armazenamento
      RATE_LIMIT_SEGREDO: ${RATE_LIMIT_SEGREDO:-compose-local-segredo-do-limite-0123456789}
      AVALIACAO_SEGREDO: ${AVALIACAO_SEGREDO:-compose-local-segredo-avaliacao-0123456789}
      # Só desenvolvimento local (32 bytes em base64); em produção use um valor próprio (README).
      ADMIN_TOTP_CHAVE: ${ADMIN_TOTP_CHAVE:-Y29tcG9zZS1sb2NhbC1jaGF2ZS10b3RwLTAxMjM0NTY=}
    volumes:
      # Fotos do armazenamento simulado (D-021); sobrevive a `down` (só `down -v` apaga). O worker não monta.
      - armazenamento:/app/.armazenamento
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem slim não tem curl/wget; usa o fetch do Node.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    # Mesma imagem da app, sem segundo build.
    image: agenda-beleza:dev
    command: ["worker"]
    init: true
    # O worker espera até 25 s pelos jobs em andamento após o SIGTERM (TIMEOUT_ENCERRAMENTO_MS);
    # 30 s dá folga antes do SIGKILL do Docker (padrão: 10 s). D-008, CA-14.
    stop_grace_period: 30s
    <<: *env-app
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata: {}
  armazenamento: {}
